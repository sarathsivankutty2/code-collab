name: CI-CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # FRONTEND
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # BACKEND
      - name: Install & Build Backend
        run: |
          cd backend
          npm install
          npm run build

